<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebsiteToPrompt</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      body {
        width: 320px;
        font-size: 13px;
      }

      .popup-header {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 12px 0 16px;
        border-bottom: 1px solid var(--border);
      }

      .wordmark {
        flex: 1;
        margin: 0;
        font: 600 15px/20px var(--font-sans);
      }

      .icon-link {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        color: var(--text-muted);
      }

      .icon-link:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .popup-body {
        display: grid;
        gap: 8px;
        padding: 16px;
      }

      #toggleSelectionBtn {
        min-height: 44px;
        font-size: 14px;
      }

      #toggleSelectionBtn[aria-pressed='true'] {
        border-color: var(--border-strong);
        background: var(--surface-2);
        color: var(--text);
      }

      #openDashboardBtn {
        min-height: 40px;
        margin-top: 8px;
      }

      .helper {
        margin: 0;
        font-size: 12px;
        line-height: 16px;
        color: var(--text-muted);
      }

      .status {
        margin: 0;
        padding: 8px 12px;
        border-left: 3px solid var(--danger);
        border-radius: 6px;
        background: var(--surface);
        font-size: 12px;
        line-height: 16px;
      }

      .status:empty {
        display: none;
      }

      .popup-footer {
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <header class="popup-header">
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1 class="wordmark">WebsiteToPrompt</h1>
      <a
        class="icon-link"
        href="https://github.com/jac-marais/WebsiteToPrompt"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Source code on GitHub"
        title="Source code on GitHub"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </header>

    <main class="popup-body">
      <button id="toggleSelectionBtn" type="button" class="button button-primary" aria-pressed="false">Select content</button>
      <p id="selectionHelp" class="helper">Hover to highlight. Scroll to widen or narrow. Click to save. Esc cancels.</p>
      <p id="popupStatus" class="status" role="status"></p>
      <button id="openDashboardBtn" type="button" class="button">Saved prompts</button>
    </main>

    <footer class="popup-footer">
      <a
        class="coffee-link"
        href="https://www.buymeacoffee.com/hello_nerdzs"
        target="_blank"
        rel="noopener noreferrer"
        title="Buy the author a coffee"
      >
        <img src="logo.png" alt="" />
        <span>npm install coffee</span>
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
