<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebsiteToPrompt</title>
    <style>
      /* Reset default styles */
      body {
        margin: 0;
        padding: 0;
        background: white;
      }

      .popup-container {
        width: 320px;
        padding: 24px 24px 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
      }

      button {
        display: block;
        margin: 8px auto;
        padding: 12px 24px;
        cursor: pointer;
        border-radius: 24px;
        font-weight: 500;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      #toggleSelectionBtn {
        background: linear-gradient(to bottom, #4a5568, #2d3748);
        color: white;
        border: none;
        font-size: 1.1rem;
        padding: 14px 28px;
      }

      #toggleSelectionBtn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      #openDashboardBtn {
        background: transparent;
        color: #2d3748;
        border: 2px solid #4a5568;
      }

      .popup-status {
        margin: 4px 0 8px;
        color: #b91c1c;
        font-size: 0.85rem;
      }

      #openDashboardBtn:hover {
        background: rgba(74, 85, 104, 0.1);
      }

      .donation-container {
        margin: 1.5rem -24px 0;
        background: #ffeea2;
      }

      .donation-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;

        padding: 8px;
        border: none;
        background: none;
        color: #1a202c;
        font-weight: 600;
        font-size: 1rem;
      }

      .donation-button img.profile-pic {
        width: 24px;
        height: 24px;
        margin-right: 8px;
        border-radius: 50%;
      }

      .header {
        margin: -24px -24px 24px;
        padding: 16px 24px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: center;
        position: relative;
      }

      .header h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        color: #1a202c;
      }

      #githubLink {
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <div class="popup-container">
      <div class="header">
        <h1>
          WebsiteToPrompt
          <a href="#" id="githubLink" style="text-decoration: none">
            <svg viewBox="0 0 16 16" width="20" height="20" aria-label="GitHub" style="vertical-align: middle; margin-left: 10px">
              <path
                fill="#24292f"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
          </a>
        </h1>
      </div>
      <!-- Toggle Selection Mode -->
      <button id="toggleSelectionBtn">Enable Selection</button>
      <p id="popupStatus" class="popup-status" hidden></p>

      <!-- Open Dashboard -->
      <button id="openDashboardBtn" title="Open your saved prompts dashboard">Open Dashboard</button>

      <div class="donation-container">
        <a
          href="https://www.buymeacoffee.com/hello_nerdzs"
          target="_blank"
          rel="noopener noreferrer"
          class="donation-button"
        >
          <img src="logo.png" alt="Profile" class="profile-pic" />
          <span>`npm install coffee`</span>
        </a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
